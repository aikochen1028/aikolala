<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小愛健康日記</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<!-- 載入 Supabase Client SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4eff5;--card:#fff;--ink:#2d1c31;--mut:#755c7a;--line:#e2d7e4;--acc:#995aa8;--p:#2f6fdc;--c:#c98d00;--f:#c2456c;--ln:#0288d1;--st:#ffe83a;--ib:#e8336d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b101e;--card:#27182a;--ink:#eee6f0;--mut:#b299b8;--line:#402c44;--acc:#c589d2;--p:#6aa0ff;--c:#f0bf3a;--f:#ee7a9e;--ln:#4fb3f0;--ib:#ff5c93}}
:root[data-theme="dark"]{--bg:#1b101e;--card:#27182a;--ink:#eee6f0;--mut:#b299b8;--line:#402c44;--acc:#c589d2;--p:#6aa0ff;--c:#f0bf3a;--f:#ee7a9e;--ln:#4fb3f0;--ib:#ff5c93}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:24px;margin:0;font-weight:700}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:20px;grid-template-columns:1fr 1fr;margin-top:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border-left:3px solid var(--line);padding-left:10px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{color:var(--mut);font-size:13px}
.scroll{overflow-x:auto}.scroll>div{min-width:640px}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.head h2{margin:0}.head input{width:auto}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>label{flex:1 1 90px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;padding:8px 14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#1f0f24}}
:root[data-theme="dark"] button.pri{color:#1f0f24}
button.ghost{background:transparent;color:var(--acc)}
button.x{background:none;border:none;color:var(--mut);padding:2px 8px;font-size:18px;line-height:1}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.bar i.over{background:var(--f)}
